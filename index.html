<title>굴러라, 금방울</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
#mini{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);background:#1b1a17;image-rendering:pixelated;display:none;pointer-events:none}
@media (max-width:560px){#mini{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:10px;transform:scale(.8);transform-origin:right bottom}}
body.talking #mini{opacity:.35}
.mg .psg{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:10px 40px 10px 12px;margin:8px 0;font-family:var(--display);font-size:16.5px;line-height:1.9;max-height:12em;overflow:auto}
.mg .psg .orig,.mg .sugi .orig{position:absolute;right:8px;top:6px;display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.mg .psg .hit{background:#dfe6ef;color:var(--indigo);font-weight:700;border-radius:3px;padding:0 2px}
.histlnk{margin-left:auto;font-family:var(--ui);font-size:12px;background:transparent;border:1.5px solid var(--line);padding:2px 8px;color:var(--muted)}
.histlnk:hover{border-color:var(--indigo);color:var(--indigo)}
.dlg .orig+.histlnk{margin-left:8px}
#hist{z-index:90}
#hist .rec.plain{border-left-color:var(--line);color:#4a3d2c}
#hist .seal-s{width:18px;height:18px;font-size:10px;vertical-align:middle}
.mg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mg .cards button{display:grid;gap:2px;text-align:left;background:#6d4b2c;color:#f1ead8;border:2px solid var(--ink2);padding:10px;min-height:70px;font-family:var(--ui);font-size:13px}
.mg .cards button b{font-family:var(--display);font-weight:400;font-size:17px}
.mg .cards button.on{background:#f7f0dc;color:var(--text);border-color:var(--gold);animation:stIn .25s}
.mg .cards button.on span{color:var(--muted)}
.mg .picks button:disabled{opacity:.6;cursor:default}
.ek{font-weight:700;color:#2a1d10;background:linear-gradient(transparent 58%,rgba(242,201,76,.6) 58%);padding:0 1px}
.eb2{font-weight:700;color:var(--seal)}
.alias{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.mg .arena{position:relative;height:90px;margin-top:10px;background:linear-gradient(#8a9a5a,#6f7f48);border:2px solid var(--ink2);overflow:hidden}
.mg .arena .zone{position:absolute;top:0;bottom:0;width:13%;background:rgba(179,54,43,.28);border-left:2px dashed var(--seal);border-right:2px dashed var(--seal)}
.mg .arena .zl{left:30%}.mg .arena .zr{right:30%}
.mg .arena .ballc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 16px 4px rgba(255,222,120,.7)}
.mg .arena .ballc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.mg .arena .tg{position:absolute;top:22px;font-size:40px;line-height:1}
.mg .belly{position:relative;height:110px;margin-top:10px;border-radius:50px;background:radial-gradient(ellipse at center,#6b1f1a,#3a0f0c 70%);border:3px solid #1d1813;overflow:hidden}
.mg .belly .organ{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 18px 6px rgba(255,222,120,.6)}
.mg .belly .gauge2{position:absolute;left:12px;right:12px;bottom:10px;height:10px;background:rgba(0,0,0,.35);border:1px solid #f1ead8}
.mg .belly .gauge2 i{display:block;height:100%;width:0;background:#f2c94c;transition:width .15s}
.mg .belly .bl{position:absolute;left:14px;bottom:22px;color:#f1ead8;font-family:var(--ui);font-size:12px}
.mg .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mg .scrolls figure{margin:0;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .scrolls svg{width:100%;max-width:170px}
.sheet.itemget{text-align:center;position:relative;overflow:hidden}
.itemget>*:not(.rays){position:relative}
.itemget .itimg{display:block;margin:6px auto 10px;width:min(240px,58vw);border-radius:8px;border:3px solid #8a6a1f;box-shadow:0 0 40px 8px rgba(255,210,110,.6);animation:itrise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes itrise{from{transform:translateY(50px) scale(.5);opacity:0}}
.itemget .rays{position:absolute;left:50%;top:140px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:itspin 14s linear infinite;pointer-events:none}
@keyframes itspin{to{transform:rotate(360deg)}}
.thumb{float:right;width:52px;height:52px;object-fit:cover;border:2px solid var(--line);border-radius:4px;margin-left:6px}
.mg .unroll{overflow:hidden;animation:unroll 1.1s ease-out both;border:2px solid #6d4b2c}
.mg .unroll img{display:block;width:100%}
.mg .scrolls figure:nth-child(2) .unroll{animation-delay:1s}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mg .backwrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}
.mg .back{width:100%;max-width:320px;background:#f7f0dc;border:2px solid var(--ink2)}
.mg .back .mole{cursor:pointer}.mg .back .mole.on circle:last-child{fill:#f2c94c}
.mg .hintd{width:100%}

function blocked(x,y,self){
  const m=G.map;if(x<0||y<0||x>=m.w||y>=m.h)return true;
  if(SOLID.has(tileAt(m,x,y)))return true;
  for(const o of m.objs){if(o.pass||(o.hide&&o.hide()))continue;if(o.k==="door"&&G.f.gateOpen)continue;
    if(x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h)return true}
  for(const n of m.npcs){if(n===self||!visible(n))continue;if(n.tx===x&&n.ty===y)return true;if(n.moving&&n.nx===x&&n.ny===y)return true}
  const p=G.player;if(!G.demo&&self!==p&&((p.tx===x&&p.ty===y)||(p.moving&&p.nx===x&&p.ny===y)))return true;

}

const keys={};let keyOrder=[];

const K2D={up:"u",down:"d",left:"l",right:"r"};
addEventListener("keydown",e=>{
  const k=KMAP[e.code];
  if(k){keys[k]=true;keyOrder=keyOrder.filter(x=>x!==k);keyOrder.push(k);if(!UI.modal){e.preventDefault();nudge(k)}}
  if(e.repeat)return;
  if(e.code==="KeyE"||e.code==="Space"||e.code==="Enter"||e.code==="KeyZ"){
    if(UI.onKey&&UI.onKey(e)){e.preventDefault();return}
    if(!UI.modal&&!G.busy&&!G.demo){e.preventDefault();interact()}
  }else if(UI.onKey){UI.onKey(e)}
  if(e.code==="Escape"&&UI.panel)closePanel();
});
addEventListener("keyup",e=>{const k=KMAP[e.code];if(k){keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k)}});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;keyOrder=[]});

  const on=e=>{e.preventDefault();keys[k]=true;keyOrder=keyOrder.filter(x=>x!==k);keyOrder.push(k);nudge(k)};
  const off=e=>{e.preventDefault();keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k)};

function interact(){
  const p=G.player;if(p.moving||G.lock)return;const [dx,dy]=DIRV[p.dir];const x=p.tx+dx,y=p.ty+dy;
  const n=G.map.npcs.find(n=>visible(n)&&n.tx===x&&n.ty===y);
  if(n&&n.talk){if(n.look!=="chicken")n.dir=OPP[p.dir];run(()=>n.talk(n));return}
  const o=G.map.objs.find(o=>o.use&&!(o.hide&&o.hide())&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);
  if(o){run(()=>o.use(o));return}
}

  if(blocked(nx,ny,ent))return false;ent.moving=true;ent.prog=0;ent.nx=nx;ent.ny=ny;ent.step++;if(ent===G.player&&ent.step%2)sfx(ent.look==="bell"?"jingle":ent.mount?"clop":"step");else if(ent.look==="bell"&&ent.step%2&&!G.demo&&Math.abs(ent.tx-G.player.tx)+Math.abs(ent.ty-G.player.ty)<9)sfx("jingle");

  if(!G.night){ambT.bird-=dt;if(ambT.bird<=0){ambT.bird=9+Math.random()*10;const y0=cam.y+14+Math.random()*50,n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)addPart({k:"bird",x:cam.x-20-i*9,y:y0+(i%2)*6+i*2,vx:34+Math.random()*4,vy:-1,life:(VW+60)/34,ph:Math.random()*6})}}

  if(G.partyAt){ambT.note=(ambT.note||0)-dt;if(ambT.note<=0){ambT.note=0.3;addPart({k:"note",x:G.partyAt[0]+Math.random()*28-14,y:G.partyAt[1],vx:0,vy:-12-Math.random()*5,life:2.4,ph:Math.random()*6,c:["#f2c94c","#e9a4b8","#9cc7dc","#ffffff"][Math.floor(Math.random()*4)]})}}
  if(G.night&&!G.snow){ambT.fly-=dt;if(ambT.fly<=0){ambT.fly=0.5;addPart({k:"fly",x:cam.x+Math.random()*VW,y:cam.y+VH*0.3+Math.random()*VH*0.6,life:5,ph:Math.random()*6})}}
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.age+=dt;if(p.age>=p.life){PARTS.splice(i,1);continue}
    if(p.k==="fly"){p.x+=Math.sin(p.age*1.7+p.ph)*8*dt;p.y+=Math.cos(p.age*1.3+p.ph)*6*dt}
    else if(p.k==="coin"){if(p.age>=0){const q=Math.min(1,p.age/p.life);p.x=p.x0+(p.x1-p.x0)*q;p.y=p.y0+(p.y1-p.y0)*q-Math.sin(Math.PI*q)*22}}

function timing(level,o){
  o=o||{};

    UI.modal=true;setBodyTalking(true);
    const v=document.createElement("div");v.className="veil";
    v.innerHTML=`<div class="sheet sew"><span class="eb">${esc(o.eb||"삯바느질")}</span><h2>${esc(o.title||"저고리 한 벌")}</h2><p class="note">${esc(o.desc||"바늘이 붉은 칸 안에 들어왔을 때 누르세요.")} (Space · E · 화면 누르기) 세 번 맞추면 끝나요.</p>
      <div class="bar"><div class="zone"></div><div class="needle"></div></div><div class="st">○ ○ ○</div></div>`;
    $("#ui").appendChild(v);
    const bar=v.querySelector(".bar"),zone=v.querySelector(".zone"),nd=v.querySelector(".needle"),st=v.querySelector(".st");
    let hits=0,pos=0,dirn=1,alive=true,zl=0,zw=0;const speed=0.55+level*0.2;
    const newZone=()=>{zw=0.2-level*0.03;zl=0.1+Math.random()*(0.8-zw);zone.style.left=zl*100+"%";zone.style.width=zw*100+"%"};newZone();
    let lt=performance.now();
    const frame=now=>{if(!alive)return;const dt=(now-lt)/1000;lt=now;pos+=dirn*speed*dt;if(pos>1){pos=1;dirn=-1}if(pos<0){pos=0;dirn=1}nd.style.left=`calc(${pos*100}% - 2px)`;requestAnimationFrame(frame)};requestAnimationFrame(frame);
    const press=()=>{if(!alive)return;
      if(pos>=zl&&pos<=zl+zw){hits++;st.textContent="● ".repeat(hits)+"○ ".repeat(3-hits);newZone();
        if(hits>=3){alive=false;setTimeout(()=>{v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res()},350)}}
      else{bar.classList.remove("shake");void bar.offsetWidth;bar.classList.add("shake")}};
    v.addEventListener("pointerdown",e=>{e.preventDefault();press()});
    UI.onKey=e=>{if(["Space","KeyE","Enter","KeyZ"].includes(e.code)){press();return true}return true};
  });
}
function orderPuzzle(title,ev){
  return new Promise(res=>{
    UI.modal=true;setBodyTalking(true);
    const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
    const got=[];const seed=ev.length*7+title.length;
    const order=ev.map((e,i)=>i).sort((a,b)=>((a*37+seed)%11)-((b*37+seed)%11));

    const paint=()=>{const done=got.length===ev.length;
      v.innerHTML=`<div class="sheet ord"><span class="eb">줄거리 잇기</span><h2>${esc(title)}</h2><p class="note">이 장에서 일어난 일을 순서대로 눌러 이어 보세요. 기억이 안 나면 앞 대화를 다시 볼 수 있어요.</p><div class="row" style="justify-content:flex-start;margin-top:0">${HISTBTN}</div>
      <ol>${got.map(i=>`<li>${esc(ev[i])}</li>`).join("")}${done?"":`<li class="empty">${got.length?"다음 사건은?":"가장 먼저 일어난 일은?"}</li>`}</ol>
      ${done?`<p class="note">줄거리를 복원했어요.</p><div class="row"><button class="btn pri" data-go="1">다음으로 ▶</button></div>`:`<div class="pool">${order.filter(i=>!got.includes(i)).map(i=>`<button data-e="${i}">${esc(ev[i])}</button>`).join("")}</div>`}</div>`};
    paint();

      const b=e.target.closest("[data-e]");if(b){const i=+b.dataset.e;if(i===got.length){got.push(i);sfx(got.length===ev.length?"correct":"click");paint()}else{sfx("wrong");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}return}

  });
}

function lungeAt(a,b){const dx=Math.sign(b.tx-a.tx),dy=Math.sign(b.ty-a.ty);a.dir=dx>0?"r":dx<0?"l":dy<0?"u":"d";a.lunge={t0:performance.now()/1000,dx,dy}}
/* 머리채를 잡고 치는 장면: 원문 그대로 '휘휘 칭칭', '이리 치고', '저리 치며' */
async function scuffle(att,vic,words){
  const p=G.player;if(att!==p&&Math.abs(att.tx-vic.tx)+Math.abs(att.ty-vic.ty)>1)setNear(att,[[vic.tx-1,vic.ty],[vic.tx+1,vic.ty],[vic.tx,vic.ty+1],[vic.tx,vic.ty-1]]);
  vic.dir=att.tx<vic.tx?"l":att.tx>vic.tx?"r":att.ty<vic.ty?"u":"d";
  for(const w of words){lungeAt(att,vic);await sleep(130);sfx(/[챙앵]/.test(w)?"clang":"slap");vic.hurt=0.35;G.shake=Math.max(G.shake||0,3);
    FX.push({k:"hit",e:vic,t0:performance.now()/1000,dur:0.7,word:w,col:"#f07a6a"});await sleep(560)}
}

const EMPH_K=window.EMPH_K_G||[];
const EMPH_B=window.EMPH_B_G||[];
function emphSegs(s){
  const mark=new Array(s.length).fill(0);
  const put=(list,v)=>{for(const w of [...list].sort((a,b)=>b.length-a.length)){let k=s.indexOf(w);while(k>=0){if(!mark.slice(k,k+w.length).some(Boolean))for(let j=k;j<k+w.length;j++)mark[j]=v;k=s.indexOf(w,k+w.length)}}};
  put(EMPH_K,1);put(EMPH_B,2);
  const segs=[];let cur=null;for(let j=0;j<s.length;j++){if(!cur||cur.c!==mark[j]){cur={t:"",c:mark[j]};segs.push(cur)}cur.t+=s[j]}
  return segs.map(x=>({t:[...x.t],c:x.c}));
}
function segHTML(segs,n){let out="",left=n;
  for(const x of segs){if(left<=0)break;const part=x.t.slice(0,left).join("");left-=x.t.length;
    out+=x.c===1?`<b class="ek">${esc(part)}</b>`:x.c===2?`<b class="eb2">${esc(part)}</b>`:esc(part)}
  return out}

function drawBell(e,sx,sy,t){
  const r=e.size||6,cx=sx+8,mv=e.moving?Math.abs(Math.sin((e.step+e.prog)*Math.PI))*2.2:Math.sin(t*3+(e.ph||0))*0.8,cy=sy+13-r-mv;
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(cx,sy+14,r*0.95,2.2,0,0,Math.PI*2);ctx.fill();
  const gl=ctx.createRadialGradient(cx,cy,r*0.4,cx,cy,r*2.8);gl.addColorStop(0,"rgba(255,222,120,"+(0.4+0.1*Math.sin(t*4))+")");gl.addColorStop(1,"rgba(255,222,120,0)");ctx.fillStyle=gl;ctx.fillRect(cx-r*3,cy-r*3,r*6,r*6);
  ctx.fillStyle="#5a3d0c";ctx.beginPath();ctx.arc(cx,cy,r+0.8,0,Math.PI*2);ctx.fill();
  const b=ctx.createRadialGradient(cx-r*0.35,cy-r*0.45,r*0.15,cx,cy,r);b.addColorStop(0,"#fff7cf");b.addColorStop(0.35,"#f5cd4f");b.addColorStop(1,"#b3800f");ctx.fillStyle=b;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  const [wx]=entPos(e),ang=wx/(r*1.1);ctx.strokeStyle="rgba(90,61,12,.85)";ctx.lineWidth=0.9;
  ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(Math.cos(ang))*r*0.92+0.3,r*0.92,0,-Math.PI/2,Math.PI/2);ctx.stroke();
  ctx.fillStyle="#5a3d0c";ctx.fillRect(Math.round(cx+Math.sin(ang)*r*0.55)-1,Math.round(cy+r*0.35),2,2);
  const sp=(t*1.3+(e.ph||0))%3;if(sp<0.5){ctx.fillStyle="#ffffff";ctx.fillRect(Math.round(cx+r*1.3*Math.cos(sp*9)),Math.round(cy-r*1.2+sp*3),1,1)}
  return cy-r-3;
}

["여차여차 점지하였노라","이러저러하게 점지하였소."],
["그리하면 이름 없는 자식이","그렇게 하면 이름도 없는 자식이 될 것이니 효부가 바라는 바가 아니오. 이러저러하게 하면 하늘의 뜻을 세상이 알 것이고, 어머니와 딸 사이의 도리도 알게 될 것이오."],
["하니 모두 옳다 하고","모두 옳다 하고 각자 오색구름을 타고 흩어지니, 막 씨가 놀라 사방을 둘러보았으나 신선들의 자취는 구름과 안개 속에 사라지고 높은 폭포에 물 흐르는 소리뿐이었다."],
["문득 학의 울음소리가 나며","문득 학 울음소리가 나더니 누런 옷을 입은 선관이 내려와 자리에 앉으며 말하기를,"],
["무료히 돌아올 때 홀연히","멍하니 돌아오다가 문득 깨어 보니 한바탕 꿈이었다. 꿈을 적어 두며 남편 삼랑이 죽은 줄 알고, 빈소를 차려 놓고 한없이 슬퍼하였다."],
["막씨가 하루는 슬픔을 머금고","하루는 막 씨가 슬픔에 잠겨 앉아 있는데, 갑자기 음산한 바람이 불더니 초막 앞에 한 사람이 서 있었다. 자세히 보니 남편 삼랑이어서 놀라며 물었다."],
["장부 나를 버리고 간 지가","당신이 나를 버리고 떠난 지 수십 년이오. 간 곳을 몰라 애태웠는데 신령이 꿈에 난리 중에 죽었다 하기에 …… 살아서 돌아오신 거요? 어찌 이 깊은 밤에 모습이 뚜렷하지 않은 거요?"],
["내 과연 그대 뜻을 모르고","내가 그대의 뜻을 모르고 방탕한 마음을 다잡지 못해 그대를 박대한 죄로 하늘의 벌을 받아 난리 통에 죽었소. …… 그대가 나를 위해 정성껏 제사를 지내 주니 어찌 부끄럽지 않겠소. 비록 산 사람과 죽은 사람으로 갈렸으나 그 고마움에 보답하려고 왔소."],
["하고 생시와 다름없이 수작하고","그러고는 살아 있을 때처럼 이야기를 나누고 돌아간 뒤 자주 오갔다. …… 열 달이 차자 해산할 기미가 있어 여막에 엎드려 있다가, 아기를 낳고 보니 아이가 아니라 금방울 같은 것이었다. 금빛이 찬란하였다."],
["막씨 크게 놀라며 괴이히","막 씨는 크게 놀라 이상히 여겨 손으로 눌러 보았으나 터지지 않고, 돌로 쳐도 깨지지 않았다."],
["다시 집어다가 멀리 버리고","다시 집어다 멀리 버리고 돌아오니 방울이 굴러 따라왔다. 더욱 신기하여 깊은 물에 던지고 돌아오니 또 따라왔다."],
["또 다시 집어다 단단히 넣으니","또다시 집어다 단단히 물속에 넣었더니 물 위에 둥둥 떠다니다가 막 씨를 보고 또 따라왔다. 막 씨가 속으로 생각하기를,"],
["내 팔자가 기구하여 이 같은","내 팔자가 기구하여 이런 괴물을 만났으니 나중에 반드시 큰일이 나겠구나."],
["아궁이를 닷새 후에 헤쳐","닷새 뒤에 아궁이를 헤쳐 보니 방울은 상하기는커녕 빛이 더욱 생생하고 향기가 진동하였다. 막 씨는 어쩔 수 없이 그대로 두고 보았는데, 밤이면 품속에서 자고 낮이면 굴러다니며 내려앉은 새도 잡고 나무에 올라가 과일도 따다가 앞에 놓았다."],
["하루는 막씨가 한데서 방아질","하루는 막 씨가 바깥에서 남의 방아를 찧어 주고 저녁에 돌아오니, 방울이 굴러와 반기는 듯하였다. 막 씨가 추위를 견디지 못해 방으로 들어가니 방 안이 덥고, 방울이 빛을 내어 대낮처럼 밝았다."],
["막씨가 기이히 여겨 남이 알까","막 씨는 신기하게 여기면서도 남이 알까 걱정되어 낮에는 여막 속에 두고 밤에는 품에 안고 재웠다. 방울은 점점 자라 산을 평지처럼 오르내리고, 마른 땅 진 땅 가리지 않고 굴러다녀도 몸에 흙이 묻지 않았다."],
["이러구러 자연히 오래되매","그럭저럭 오랜 시간이 지나자 방울의 빛이 더욱 찬란하고 부드러워졌다. 사람들이 소문을 듣고 구경하러 몰려와 문이 미어질 만큼 들어와 방울을 집어 보려 하였다."],
["흑 남자가 집으려면 땅에","혹 남자가 집으려 하면 방울이 땅에 박혀 떨어지지 않을 뿐 아니라 몸이 불처럼 뜨거워 손을 댈 수가 없었다. 사람들은 더욱 신기하게 여겨 마침내 집어 보려는 사람이 없어졌다."],
["동리에 사는 무손이라는","마을에 무손이라는 사람이 있었는데, 살림은 넉넉했지만 욕심이 많고 행실이 사람의 도리에 어긋난 자였다. 막 씨의 방울을 훔치려고 막 씨가 잠든 틈에 몰래 방울을 훔쳐 집에 가져가 처자식에게 자랑하고 감추어 두었다."],
["그 날 밤에 난데없는 불이","그날 밤 난데없는 불이 나서 온 집을 에워쌌다. 무손은 크게 놀라 옷도 못 입고 알몸으로 내다보니 불꽃은 하늘을 찌르고 바람은 불길을 도와 어찌할 도리 없이 재물과 살림살이가 모두 재가 되었다."],
["이 같은 더위에 추워하느뇨","이렇게 더운데 춥다고 하는가?"],
["방울이 끓는 듯한데 어찌","방울이 펄펄 끓는 것 같은데 어찌 차다고 하는가?"],
["하고, 서로 다투거늘","그러면서 서로 다투었는데, 방울은 참으로 조화를 부려 한쪽에게는 얼음처럼 차고 한쪽에게는 불처럼 뜨거웠던 것이다. 이런 변화를 모르다가 그제야 깨닫고 말하기를,"],
["우리 무상하여 하늘이 내신","우리가 어리석어 하늘이 내린 보물을 모르고 훔쳐 왔다가 도리어 이런 꼴을 당했으니 누구를 원망하고 누구를 탓하겠는가."],
["그러나 무심은 도리어 원심을","그러나 무손은 도리어 원한을 품고 고을 관가에 가서 지현에게 방울이 신통하다고 말하고, 또 요사스러운 물건이라고 고발하였다."],
["소인이 잡으려고 한즉","제가 잡으려고 하였더니 이리 미끄러지고 저리 미끄러져 잡지 못하고 돌아왔습니다."],
["지현이 자세히 보니 방울이","지현이 자세히 보니 방울의 금빛이 찬란하여 사람을 놀라게 하였다. 한편으로는 괴이하고 한편으로는 신기하게 여겨 군졸에게 쇠망치로 깨뜨리라 명하니, 군사가 힘껏 내리쳤다."],
["방울이 망 속으로 들어","방울이 (내리치는 대로) 들어갔다가 도로 튀어나오니, 어쩔 수 없어 이번에는 돌 위에 올려놓고 도끼로 찍었다."],
["방울이 점점 자라","그러자 방울이 점점 자라나 사람 키보다 커졌다. 지현이 크게 화를 내며 보검을 내주며 말하기를,"],
["이 보검을 천하무당인지라","이 보검은 천하에 당할 것이 없어, 사람을 베어도 칼날에 피도 묻지 않는다. 이 칼로 베어라."],
["군사가 그 명령을 듣고","군사가 명령을 듣고 힘껏 내리치니 두 조각으로 갈라져 서로 부딪치며 굴렀고, 연거푸 칠 때마다 방울이 늘어나 뜰에 가득한 것이 모두 방울이었다."],
["저마다 크게 놀란 것은","모두 크게 놀란 것은 말할 것도 없고, 지현은 더욱 화가 나서 기름을 끓여 방울을 넣으라 하였다."],
["과연 방울이 차차 작아지는","과연 방울이 점점 작아졌다. …… 방울은 더욱 작아져 대추씨만 해지더니 기름 위에 둥둥 떠다니다 가라앉았다. 건지려고 가 보니 그렇게 끓던 기름이 엉겨 쇠처럼 굳어 있었다. 지현은 괴이하게 여기면서도 크게 화가 나 막 씨를 옥에 가두라 하고 안채로 들어갔다."],
["오늘 이 물건을 보니 하늘이","오늘 그 물건을 보니 하늘이 내린 것입니다. 막 씨를 풀어 주고 앞으로의 일을 지켜보시는 것이 좋겠습니다."],
["요물이 신통하다 하나","요사스러운 물건이 신통하다 한들 어찌 저만한 것을 다스리지 못해 걱정하겠소."],
["방울이 가마에 들었다가","방울은 가마 속에 있다가 밤이 되자 가마를 뚫고 나와 곧장 지현이 자는 방의 아궁이로 들어갔다."],
["자리가 더웁기 불같으며","자리가 불처럼 뜨거워 살이 데어 벗겨질 것 같다."],
["이러하기를 삼사일에","이러기를 사나흘, 먹지도 자지도 못해 거의 병이 날 지경이 되자 그제야 방울의 조화인 줄 알고 가마에 가 보니 가마 밑이 뚫리고 방울은 간 데가 없었다."],
["방울이 옥문 밑을 뚫고","방울이 옥문 밑을 뚫고 드나들며 과일도 물어다 넣기에 문틈으로 살펴보니, 오색 구름이 옥 안을 둘러싸고 있어 사람은 보이지 않았습니다."],
["부인이 이 말을 듣고 방면함을","부인이 이 말을 듣고 다시 풀어 주라 권하니, 지현이 그제야 깨닫고 막 씨를 풀어 주었고 그제야 먹고 자는 것이 예전과 같아졌다. 또 막 씨의 효행을 듣고 지현 부부는 크게 뉘우쳐, 초막을 헐고 큰 집을 지어 주고 잡인이 드나들지 못하게 하며 다달이 녹을 주어 막 씨가 평생 편안히 살게 하였다."],
["이 때 공이 뇌양에 온 후로","이때 장공은 뇌양에 온 뒤로 몸은 편안했으나 밤낮으로 해룡을 생각하며 부인과 함께 슬퍼하였다. 부인은 이 때문에 병이 들어 위독해졌고, 어떤 약도 효과가 없었다."],
["내 팔자가 기박하여 한낱","내 팔자가 사나워 하나뿐인 자식을 난리 속에 잃고, 그래도 살아 있으면 만나 볼까 하였는데 십여 년이 지나도록 살았는지 죽었는지 알 수 없고, 병이 들어 목숨이 오늘에 달렸습니다. 저승에 가서도 눈을 감지 못하겠습니다. 부디 몸을 잘 돌보시고 혹시 해룡을 만나거든 영광을 누리십시오."],
["하고, 이내 숨이 지니","그러고는 숨을 거두니, 장공은 하늘이 무너지는 듯한 슬픔에 기절하여 쓰러졌고 곁의 사람들이 부축하여 돌보았다."],
["금령이 밤이면 품속에 들어","금령은 밤이면 부인의 품에서 자고 낮이면 제 집(막 씨의 집)에 가니 친자식과 같았다. 하루는 금령이 밖에 나가 무언가를 물어다 놓기에, 장공 부부가 이상히 여겨 보니 족자 하나였다."],
["그 족자에 그렸으되","그 족자에는 한 아이가 길가에서 울고 있고 사방에서 도적이 쫓아오는데, 부부 두 사람이 아이를 버리고 가자 아이가 돌아보는 모습이 그려져 있었다. 또 도적 가운데 한 사람이 그 아이를 업고 마을로 가는 모습도 그려져 있었다."],
["이는 분명 우리가 해룡을","이것은 분명 우리가 해룡을 버리고 떠나온 모습이오."],
["비록 그러나, 어찌 사생을","그렇다 한들 살았는지 죽었는지 어찌 알겠습니까?"],
["사람이 없고 촌 가운데로","(도적이) 아이를 업고 마을로 들어가는 모습을 보니 누군가 기르려고 업어 간 것 같고, 금령이 신통하여 우리가 슬퍼하는 것을 보고 아이 있는 곳을 알려 준 것이니 이 또한 하늘의 뜻이라 생각하여, 족자를 침상에 걸어 두고 늘 슬퍼하였다."],
["이 때 홀연히 금광이 찬란한","이때 갑자기 찬란한 금빛 속에서 방울이 밖에서 굴러 들어와 부인의 시신 앞에 앉았다. 모두 울음을 그치고 보니 풀잎 같은 것을 물어다 놓고 가는 것이었다."],
["모두 괴이하게 여기어 집어","모두 이상히 여겨 집어 보니 나뭇잎 한가운데 가늘게 ‘보은초(은혜를 갚는 풀)’라 쓰여 있었다. 장공은 속으로 ‘막 씨가 은혜를 갚는구나’ 생각하고 크게 기뻐하며 부인의 입에 넣으니, 밥 한 끼 먹을 만한 시간이 지나 부인이 몸을 움직이며 돌아누웠다."],
["자고 나매 정신이 생생하여","자고 일어난 것처럼 정신이 맑아졌습니다."],
["부인이 하례하고자 하여","부인은 고마움을 표하려 막 씨가 데려온 방울의 조화로 되살아난 은혜에 거듭 감사하고 막 씨와 의형제를 맺었다. 그 뒤로 방울이 부인 앞으로 굴러오면 장공 부부가 아껴 놓지 않았고, 방울은 알아듣는 듯 이리 안기고 저리 품기며 사람의 뜻대로 영리하게 움직였다. 그래서 이름을 ‘금령(금방울)’이라 지었다."],
["하루는 금령이 홀연히 간 곳이","하루는 금령이 갑자기 사라져 버렸다. 막 씨가 울며 장공에게 와서 금방울이 없어졌다고 말하니 장공 부부도 크게 놀라 슬퍼하였다."],
["이 때가 엄동설한이라","이때는 한겨울이었다. 변 씨는 소룡과 따뜻한 방에서 자고, 해룡에게는 방아만 찧으라 하니 해룡은 어쩔 수 없이 밤새 방아를 찧었다. 홑옷만 입은 아이가 어찌 굶주림과 추위를 견디겠는가."],
["추움을 견디지 못하여 자기","추위를 견디지 못해 제 방에 들어가 쉬려 하였으나 눈보라가 들이치고 덮을 것이 없었다. 몸을 웅크리고 엎드려 있는데 갑자기 방 안이 대낮처럼 밝아지고 여름처럼 더워져 온몸에 땀이 났다."],
["방앗간에 나아가 보니 밤에","방앗간에 가 보니 밤에 다 찧지 못한 곡식이 모두 찧어져 그릇에 담겨 있었다. 크게 의심하며 방으로 돌아오니 여전히 밝고 더웠다. 아무리 생각해도 이상하여 둘러보니 침상 위에 전에 없던 북만 한 방울 같은 것이 놓여 있었다."],
["생이 잡으려 한즉 이리 미끈","해룡이 잡으려 하자 이리 미끄러지고 저리 미끄러져 달아나고, 요리조리 굴러 잡히지 않았다. 놀랍고 신통하여 자세히 보니 금빛이 방 안에 가득하고 움직일 때마다 향기가 났다."],
["이것이 반드시 무심치","이것은 반드시 무슨 까닭이 있을 것이니 두고 지켜보리라."],
["천상천하에 흰 눈이 가득하되","온 세상이 흰 눈으로 덮였는데 오직 해룡의 방 지붕에만 눈이 한 점도 없고, 검은 기운이 연기처럼 피어오르니 이게 어찌 된 일인가?"],
["홀연히 일진광풍이 일어나며","갑자기 한바탕 사나운 바람이 일어 반 시간도 안 되어 눈을 다 쓸어 버리고 그쳤다. 해룡은 이미 까닭을 짐작했지만, 변 씨는 더욱 신통하게 여기며 속으로 생각하기를,"],
["해룡이 분명 요술을 부리어","해룡이 분명 요술을 부려 사람을 속이는구나. 이대로 두었다가는 큰 화를 입겠다."],
["우리 집의 전장이 구호동에","우리 집 논밭이 구호동에 있는데, 요즘 호랑이가 자주 나타나 사람을 해치는 바람에 농사를 짓지 않은 지 수십 년이 되었다. 이제 그 땅을 다 일구면 너를 장가도 보내고 우리도 네 덕에 잘살 수 있으니 어찌 기쁘지 않겠느냐마는, 너를 위험한 곳에 보냈다가 혹시 후회할 일이 생길까 걱정이구나."],
["인명은 재천이니 어찌","사람의 목숨은 하늘에 달렸으니 어찌 짐승에게 해를 당하겠습니까?"],
["밭을 두어 이랑 갈 때","밭을 두어 이랑 갈았을 때 갑자기 바람이 일고 모래가 날리더니 산 위에서 이마가 흰 호랑이가 붉은 입을 벌리고 달려들었다. 해룡이 정신을 가다듬고 맞서려는데, 서쪽에서 또 큰 호랑이가 벼락 같은 소리를 지르며 달려드니 해룡이 매우 위태로웠다."],
["이 때 홀연히 등뒤로부터 금방울이","이때 갑자기 등 뒤에서 금방울이 달려 나와 한 번씩 들이받으니 범이 소리를 지르며 달아났다. 방울이 나는 듯이 잇달아 들이받자 두 범이 모두 쓰러졌다."],
["이 때 홀연히 등뒤로부터 금방울이 내달아 한 번씩 받아 버리니 그 범이 소리를 지르고 달아나거늘 방울이 나는 듯이 연하여 받으나, 두 범이 모두 거꾸러지는 것이었으니, 해룡이","이때 갑자기 등 뒤에서 금방울이 달려 나와 한 번씩 들이받으니 범이 소리를 지르며 달아났다. 방울이 나는 듯이 잇달아 들이받자 두 범이 모두 쓰러졌고, 해룡이 달려들어 두 범을 죽였다. 그러자 방울이 번개처럼 굴러다니며 한 시각도 안 되어 그 넓은 밭을 다 갈아 버렸다."],
["방울이 번개같이 굴러다니며","방울이 번개처럼 굴러다니며 한 시각도 안 되어 그 넓은 밭을 다 갈았다. 해룡은 매우 기특히 여겨 금방울에게 거듭 고마워하였다."],
["해룡이 혼연히 다짐을 두니","해룡이 순순히 죄를 인정하는 다짐을 쓰니, 그대로 문서를 꾸미고 큰 칼(목에 씌우는 형틀)을 씌워 옥에 가두었는데, 해룡의 온몸을 금빛이 감싸고 있었다."],
["해룡이 비록 칼을 쓰고","해룡이 비록 목에 칼을 쓰고 옥에 갇혀 있으나 비단 이불을 덮고 자고 있었습니다."],
["홀연이 불이 사면에서 일어나","갑자기 사방에서 불이 일어나 집을 둘러싸고 불빛이 하늘을 찔렀다. …… 난데없는 바람이 불길을 도와 온 집이 타는데, 오직 해룡이 있던 바깥채만은 조금도 불이 붙지 않았다."],
["하늘이 어찌 사람을 내시고","하늘은 어찌 사람을 내시고 이토록 괴로움과 욕을 겪게 하시는가."],
["해룡이 홀홀이 집을 떠나가는데","해룡이 훌훌 집을 떠나가는데 앞에 큰 산이 가로막혀 어디로 가야 할지 몰라 망설이고 있을 때, 금령이 굴러와 갈 길을 이끌었다."],
["이때 문득 벽력같은 소리가","이때 갑자기 벼락 같은 소리가 울리더니 금빛 털이 돋은 짐승이 붉은 입을 벌리고 해룡을 해치려 달려들었다. 해룡이 급히 피하려는데 금령이 굴러 나와 막으니, 그 짐승이 몸을 흔들어 머리 아홉 개 달린 악귀로 변하더니 금령을 삼키고 들어가 버렸다."],
["이번에는 반드시 금령이","이번에는 틀림없이 금령이 죽었구나."],
["우리 대왕이 전일에는","우리 대왕은 예전에는 힘이 누구보다 세고 신통력이 대단해 당해 낼 자가 없었는데, 오늘은 나갔다가 갑자기 배를 앓으며 돌아와 피를 수없이 토하고 기절하였으니,"],
["해룡이 이 형상을 보고","해룡은 이 모습을 보고 요괴를 죽이려 했으나 빈손이라 쇳조각 하나 없어 어쩔 줄 모르고 있는데, 그때 한 미인이 칠보로 꾸민 붉은 치마를 입고 가볍게 걸어와 벽에 걸린 보검을 가져다 급히 해룡에게 주었다."],
["해룡이 즉시 그 보검을","해룡이 곧바로 보검을 받아 들고 달려들어 요괴의 가슴을 수없이 찌르니 그제야 짐승이 죽어 늘어졌다. 자세히 보니 금빛 털이 돋은 암퇘지였고, 가슴을 헤쳐 보니 금령이 굴러 나왔다."],
["저 금방울이 천지조화로 되었음에 재주가 무궁하고 신통이 기이하기로 정히 요괴를 잡고 공주를 구하여 고국에 돌아가게 하였음이, 다 금령의 조화로 됨이요. 아무리","저 금방울은 하늘과 땅의 조화로 생겨나 재주가 끝이 없고 신통력이 기이합니다. 요괴를 잡고 공주를 구해 나라로 돌아가게 된 것도 모두 금령의 조화입니다. 아무리 어려운 일이 생겨도 금령이 구해 줄 것이니 걱정 마시고 잠시만 기다리십시오."],
["저 금방울이 천지조화로","저 금방울은 하늘과 땅의 조화로 생겨나 재주가 끝이 없고 신통력이 기이합니다. 요괴를 잡고 공주를 구해 나라로 돌아가게 된 것도 모두 금령의 조화입니다."],
["공주는 금령을 차마 손에","공주는 금령을 차마 손에서 놓지 못하고 밤낮으로 안은 채 길을 서둘러 서울로 올라왔다."],
["하늘이 너같은 영물을","하늘이 너 같은 신령스러운 것을 내시어, 신통력이 거룩하고 재주가 비상하여 요괴를 잡고 공주와 시녀들을 구하고 세상의 몹쓸 짐승을 없앴으며, 나로 하여금 잃었던 공주를 다시 만나 부모 자식의 도리를 온전하게 하였으니 이는 모두 네 덕이다. 이렇게 큰 은혜를 무엇으로 갚겠느냐?"],
["이 때 문득 서남간으로부터","이때 갑자기 서남쪽에서 금빛이 떠오르더니 금령이 불길을 뚫고 들어와 원수 앞에서 찬바람을 일으키니, 하늘을 찌르던 불꽃이 원수 앞으로는 번지지 않고 다른 곳으로 몰려갔다."],
["너의 후은을 생각할 양이면","너의 두터운 은혜를 생각하면 태산도 가볍고 강과 바다도 얕으니 어찌 다 갚겠느냐."],
["간밤에 금령이 이것을","지난밤 금령이 이것을 놓아두고 사라졌으니 참으로 괴이하구나."],
["이 때 막씨는 금령을 잃고","이때 막 씨는 금령을 잃고 밤낮으로 슬퍼하였고 장공 부부도 슬퍼하였는데, 하루는 밤늦도록 이야기를 나누고 있을 때 갑자기 금령이 문을 열고 들어오니 모두 반가움을 이기지 못하였고, 막 씨는 뛰어나와 금령을 안고 한없이 반가워하였다."],
["그대들의 액운이 다하였으니","그대들의 불운이 다하였으니, 머지않아 아들이 이 길로 올 것이오. 때를 놓치지 마시오."],
["그대는 아마도 여아의 얼굴을","그대는 딸의 얼굴을 보면 저절로 알아볼 것이오."],
["너는 인연이 다하였으며","너는 (방울로서의) 인연이 다하였으니, 이제 인간 세상에서 부귀영화를 한껏 누릴 것이다."],
["하고 손으로 어루만지니","그러고는 손으로 쓰다듬으니 문득 방울이 터지며 옥같이 아름다운 선녀가 나왔다. 선관이 또 말하기를,"],
["우리가 주었던 보배를","우리가 주었던 보배를 돌려 다오."],
["하니 그 선녀가 다섯 가지","그러자 선녀가 보배를 모두 돌려주니, 선관이 받아 소매에 넣고 공중으로 훌쩍 올라갔다. 놀라 깨어 보니 한바탕 꿈이었다."],
["아름다운 자태와 갖은 애교가","아름다운 모습과 사랑스러운 태도가 맑고 고와 듣도 보도 못한 처음이었다. 모두 기뻐하며 이름을 금령 소저라 하고, 자(字)를 선애라 하였다."],
["화설 대원 지정말에","이야기는 원나라 지정 연간 말기의 일이다. 장원이라는 사람이 있었는데 벼슬이 겨우 한림원에 이르렀다. 원나라가 망하고 명나라가 일어서자 세상을 걱정하여 태안주의 이릉산에 숨어 살았다."],
["시운이 불리하여 조만간에","운수가 좋지 않아 곧 큰 화가 닥칠 것이니 서둘러 떠나라."],
["소자는 동해 용왕의 셋째","저는 동해 용왕의 셋째 아들로, 남해 용왕의 사위가 되어 아내를 맞아 오던 길에 동해 바닷가에서 남섬진주의 요괴를 만났습니다. 요괴가 아내를 빼앗으려 하여 둘이 힘을 합쳐 싸웠으나 아내는 힘이 다해 죽고, 저도 어려서 신통력을 부리지 못해 달아나는 중입니다. …… 부인께서 잠깐 입을 벌려 주시면 그 안에 몸을 피하고 다음 생에 은혜를 갚겠습니다."],
["하거늘 부인이 잠간 입을","이에 부인이 잠깐 입을 벌리니, 용왕의 아들은 몸을 흔들어 붉은 기운으로 변해 들어갔다."],
["자식의 급한 것을 구하여","위급한 제 자식을 구해 주셨으니 그 은혜를 잊을 수 없습니다. …… (옥황상제께서) ‘용왕의 아들도 인간 세상에 내보내 다하지 못한 인연을 마저 이루라’ 하시기에, 제가 금광에게 부탁하여 그대 집에 태어나게 정하였습니다."],
["과연 그 달부터 태기가 있어","과연 그달부터 아이가 들어서 열 달이 차자 옥 같은 아들을 낳았는데, 얼굴이 남전산에서 본 선동과 같았다. …… 이름을 해룡이라 하고 자를 응천이라 하였다."],
["호사다마는 고금의 상사라","좋은 일에는 흔히 궂은일이 따르는 법이니, 예나 지금이나 흔한 일이다."],
["아이를 보전코자 할진대","아이를 지키려다가는 우리가 다 죽을 것이니, 당신은 우리 모자를 잠깐 버리고 피하셨다가 나중에 우리 뼈나 거두어 주십시오."],
["해룡을 버리고 가자","해룡을 두고 가자."],
["우리 잠깐 다녀 올 것이니","우리가 잠깐 다녀올 테니 과일을 먹으며 앉아 있거라."],
["장공이 좋은 말로 달래고","장공이 좋은 말로 달래고 부인을 재촉하여 달아나는데, 걸음마다 돌아보니 해룡이 부모를 부르며,"],
["쉬 오라","빨리 돌아와요."],
["어린 아이가 부모를 잃고","어린아이가 부모를 잃고 우는 것이 무슨 죄라고 죽이려 하는가?"],
["내 위세에 핍박하여","내가 위세에 눌려 억지로 도적의 무리에 끼었으니 어찌 본마음이겠는가. 또 이 아이의 관상을 보니 귀하게 될 상이다. 이 틈에 달아나야겠다."],
["해룡을 아주 잃을 줄","해룡을 아주 잃게 될 줄 알았다면 무슨 표시라도 해 두었다가 훗날 만날 때 증거로 삼았을 것을, 급한 김에 생각하지 못하고 그냥 도망쳐 왔으니 어디서 만난들 알아볼 수 있겠습니까."],
["아이는 등에 붉은 사마귀","아이 등에는 붉은 사마귀 일곱 개가 북두칠성처럼 나 있으니 그것이 증표가 될 것이오. 부인은 걱정 마시오."],
["낭군의 사생을 알지 못하여","당신이 살았는지 죽었는지 몰라 밤낮으로 잠도 못 자고 밥도 못 먹었는데, …… 오늘 이렇게 살아서 다시 만날 줄 어찌 알았겠습니까."],
["이 아이를 어디서 얻어","이 아이는 어디서 얻어 왔습니까?"],
["장삼이 여차여차하여","장삼이 이러저러하여 얻었다고 하니, 변 씨는 기뻐하는 척했지만 속으로는 그다지 반기는 기색이 없었다."],
["장삼이 졸연 병을 얻어","장삼이 갑자기 병이 들어 어떤 약도 소용이 없으니, 해룡이 정성을 다해 돌보았으나 조금도 나아지지 않았다."],
["내 명은 오늘뿐이라. 어찌","내 목숨은 오늘뿐이다. 어찌 부자의 정을 속이겠느냐. 너를 난리 통에 얻었는데 생김새가 비범하여 …… 변 씨는 어질지 못하니 내가 죽은 뒤 반드시 너를 해치려 할 것이다. 몸을 지킬 방도는 너에게 달렸으니 조심하여라. 또 대장부는 사소한 원한을 마음에 두지 않는 법이니, 소룡이 비록 못났으나 내 자식이니 거두어 준다면 저승에 가서도 한이 없겠다."],
["내 명은 오늘뿐이라, 죽은","내 목숨은 오늘뿐이다. 내가 죽은 뒤에도 해룡을 각별히 아껴 소룡과 다름없이 대하여라. 이 아이는 훗날 귀하게 될 것이니 두고두고 영화를 볼 것이다. 오늘 내 유언을 저버리지 마라."],
["하고, 말을 마치며 죽으니","말을 마치고 숨을 거두니, 해룡이 한없이 슬퍼하는 모습에 보는 사람마다 감탄하였다."],
["둘이 글을 배우매 해룡은","둘이 함께 글을 배우는데 해룡은 한 글자를 알면 열 글자를 깨우쳐 열 살도 되기 전에 뛰어난 문장가가 되었다. 장삼은 본래 어진 사람이라 해룡을 친자식처럼 아꼈고, 변 씨는 그것을 늘 시기하였다."],
["이 때 변씨는 해룡을 박대함이","이때 변 씨는 해룡을 날마다 더 박대하여 옷과 밥을 제때 주지 않고, 낮에는 밭 갈기, 논매기, 소 먹이기, 나무하기로 잠시도 쉬지 못하게 하고 밤낮으로 들볶았다. 해룡은 더욱 공손하고 부지런하여 조금도 피하지 않았으나, 자연히 얼굴이 야위고 굶주림과 추위를 견디지 못하였다."],
["생이 한편 놀라고 한편","해룡이 한편 놀랍고 한편 이상하여 곧 일어나 살펴보니, 아직 동이 트지 않았는데 흰 눈이 뜰에 가득하였다. 방앗간에 가 보니 밤에 다 찧지 못한 곡식이 모두 찧어져 그릇에 담겨 있었다."],
["침상에 이전에 없던 북 만한","침상 위에 전에 없던 북만 한 방울 같은 것이 놓여 있기에, 해룡이 잡으려 하자 이리 미끄러지고 저리 미끄러져 달아났다."],
["요리 구르고 저리 굴러","요리조리 굴러 잡히지 않았다. 놀랍고 신통하여 자세히 보니 금빛이 방 안에 가득하고 움직일 때마다 향기가 났다."],
["해룡이 얼어 죽었으리라","해룡은 틀림없이 얼어 죽었겠지."],
["해룡이 들어와 변씨에게","해룡이 들어와 변 씨에게 아침 문안을 드린 뒤 비를 들고 눈을 쓸려 하자, 갑자기 한바탕 사나운 바람이 일어 반 시간도 안 되어 눈을 다 쓸어 버리고 그쳤다."],
["해룡은 이미 짐작하되","해룡은 이미 까닭을 짐작했지만, 변 씨는 더욱 신통하게 여기며 속으로 생각하기를,"],
["집안 어른이 돌아가시매","집안 어른이 돌아가신 뒤 살림이 점점 줄어 형편이 말이 아닌 것은 너도 보아서 알 것이다. 우리 집 논밭이 구호동에 있는데, 요즘 호랑이가 자주 나타나 사람을 해치는 바람에 농사를 짓지 않은 지 수십 년이 되었다. 이제 그 땅을 다 일구면 너를 장가도 보내고 우리도 네 덕에 잘살 수 있으니 어찌 기쁘지 않겠느냐마는, 너를 위험한 곳에 보냈다가 혹시 후회할 일이 생길까 걱정이구나."],
["속히 잘 다녀 오라","어서 잘 다녀오너라."],
["해룡이 조금도 두려워하지","해룡은 조금도 두려워하지 않고 옷을 벗고 잠깐 쉬려 하는데, 해가 서산에 지려 하였다."],
["생이 크게 기특히 여기어 금방울에게 무수히 치사하고 이미","해룡은 매우 기특히 여겨 금방울에게 거듭 고마워하고, 죽은 범을 끌고 산을 내려오며 돌아보니 금령은 어디론가 사라지고 없었다."],
["네가 무사히 다녀왔구나","네가 무사히 다녀왔구나?"],
["네 저런 큰 범을 어디서","너는 저런 큰 범을 어디서 잡았느냐?"],
["마침 호랑이 덫을 놓아","마침 호랑이 덫을 놓았다가 잡아 왔습니다."],
["그때 바로 오능령이란","그때 오능령이라는 고개를 넘어오는데 갑자기 강도 떼가 달려들어 옳고 그름을 따지지도 않고 변 씨 모자를 붙잡아 나무 꼭대기에 높이 매달아 놓고, 가진 돈과 옷을 벗겨 달아났다."],
["어떤 도적이 사람을 벌거벗겨","어떤 도적이 사람을 벌거벗겨 나무에 높이 매달아 놓았더라."],
["해룡이 의아하여 바삐 가서","해룡이 이상히 여겨 서둘러 가 보니 변 씨 모자가 벌거벗은 채 나무에 높이 매달려 있었다. 해룡은 나무에 올라가 끌어내려 업고 돌아왔다."],
["이 때 금령의 신통이 무량하여","이때 금령의 신통력이 끝이 없어 해룡이 여름이면 서늘하게, 추우면 따뜻하게 해 주고 어려운 일이 있으면 해결해 주니, 해룡은 금령에게 마음을 붙이고 세월을 보냈다. 그러던 중 소룡이 나가 놀다가 사람을 죽이고 들어와 말하였다."],
["네가 사람을 쳐서 죽이고","네가 사람을 때려죽이고 모르는 척하며 어린 동생에게 죄를 떠넘기느냐?"],
["내가 내어 주면 소룡이","내가 소룡을 내주면 소룡은 반드시 죽을 것이다. 소룡이 아까워서가 아니라 (양아버지) 장삼 공의 대가 끊길까 걱정되니 차마 어찌하겠는가. 내가 죽어 혼이라도 길러 준 은혜를 갚으려니와, 공이 돌아가실 때 남긴 유언을 저버리지 않으리라."],
["살인한 사람은 곧 나이며","사람을 죽인 것은 바로 나요, 저 소룡은 죄가 없소."],
["죄인들이 있는 곳은 어두워","다른 죄인들이 있는 곳은 어두워 보이지 않는데 해룡이 있는 곳은 불빛 같은 것이 비쳐 밝기에 자세히 보니, 해룡이 비록 목에 칼을 쓰고 옥에 갇혀 있으나 비단 이불을 덮고 자고 있었습니다."],
["이날 마침 지현이 아이를","이날 마침 지현이 아이를 앞에 앉혀 두고 해룡에게 매를 치는데, 매가 내려칠 때마다 그 아이가 울다가 기절하곤 하였다."],
["옥중에서 아이 울음소리가","옥 안에서 아이 울음소리가 나니 참으로 괴이합니다."],
["지현이 이 말을 듣고 크게","지현이 이 말을 듣고 크게 놀라 허겁지겁 옥으로 달려가 보니, 제 아이가 해룡 앞에 앉아 울고 있는 것이 아닌가."],
["요인 해룡이 극히","요사스러운 해룡은 몹시 흉악한 놈이니, 더 묻지 말고 쳐 죽여라."],
["형졸들이 영을 받고","형리들이 명을 받아 큰 매를 잡고 힘껏 쳤지만 해룡은 꿈쩍도 하지 않았고, 지현의 아들이 또 울다가 기절하곤 하였다."],
["그 아이가 울음을 그치고","그 아이가 울음을 그치고 웃으며 해룡에게 안겨 노는 것이 아닌가. 해룡 곁을 잠시도 떠나지 않으니, 지현은 어쩔 수 없이 해룡을 풀어 주고 아이를 돌보게 하였다."],
["해룡이 저렇듯 하였으니","해룡이 저렇게 되었으니, 만약 억울하게 대신 죽을 뻔한 일을 지현에게 다 말하면 우리는 반드시 죽을 것이다. 이제 꾀를 내어 이러이러하면 뒤탈을 없앨 수 있겠다."],
["이제 들은즉 외숙의 병이","방금 들으니 외삼촌의 병이 몹시 위중하여 목숨이 오늘내일한다는 기별이 왔으니 가 보지 않을 수 없다. 내가 소룡과 함께 급히 다녀올 테니, 너는 못 가겠거든 집에서 자며 우리를 보내 다오."],
["해룡이 응락하고 나와","해룡이 그러겠다고 하고 나와 잠을 자는데, 갑자기 사방에서 불이 일어나 집을 둘러싸고 불빛이 하늘을 찔렀다. 깊이 잠들었던 해룡이 놀라 뛰쳐나와 보니 불길은 더욱 거세지고, 난데없는 바람이 불을 도왔다. 그런데 오직 해룡이 있던 바깥채만은 조금도 불이 붙지 않았다."],
["하며, 들어가 벽에다 글을","그러고는 들어가 벽에 글을 쓰고, 장삼의 무덤에 가서 한바탕 통곡한 뒤 옷을 떨치고 길을 떠났다. 그러나 갈 곳을 몰라 남쪽으로 정처 없이 걸어갔다."],
["보기를 다한 후에 혹시","(변 씨는) 글을 다 읽은 뒤 혹시 남이 알까 두려워 그 글을 곧바로 불태워 버리고, 모자는 집 한 채를 태워 먹은 채 바깥채에서 더부살이하듯 살았다."],
["황후께서 늦게야 따님","황후께서 늦게야 따님 한 분을 얻으셨는데 아름다움과 덕이 모두 갖추어져 비길 데가 없었다. …… 궁호를 ‘금선공주’라 하였다."],
["홀연 서남쪽 땅에서","갑자기 서남쪽에서 구름 한 떼가 일고 사나운 바람이 불더니 괴이한 물건 하나가 입을 벌리고 달려들어, 모두 엎어져 기절하였다."],
["공주를 찾아 바치는 자","공주를 찾아 데려오는 사람이 있으면 천하를 반으로 나누어 주고 부귀영화를 함께 누리리라."],
["금령을 구하지 않고","금령을 구하지 않고 어찌 이렇게 헤매고만 있느냐? 어서 구하라."],
["하늘이 가르치니, 부득이","하늘이 가르쳐 주시니 어쩔 수 없이 구하러 가야겠지만, 빈손이고 몸에 쇳조각 하나 없으니 어떻게 맞서겠는가."],
["금령이 없으면 내 어찌하여","(그러나) 금령이 없었다면 내가 어찌 살아났겠는가."],
["옷차림을 단단히 하고","옷차림을 단단히 여미고 한 번에 뛰어 들어가니, 바로 앞도 분간할 수 없을 만큼 캄캄하였다."],
["홀연히 천지가 밝아지고","갑자기 하늘과 땅이 환해지고 해와 달이 고요한데, 둘러보니 푸른 돌비석에 금 글씨로 ‘남천산 봉래동’이라 새겨져 있었다. 구름 같은 돌다리 위로 높은 폭포가 흐르는 소리에 세상일을 잊을 만하였다."],
["자세히 본즉 문 위에 금자로","자세히 보니 문 위에 금 글씨로 ‘금선수부(금선의 물속 궁궐)’라 쓰여 있었다."],
["우리 공주 낭랑이 간밤에","우리 공주님이 지난밤 꿈을 꾸셨는데, 하늘에서 선관이 내려와 ‘내일 오시(낮 열두 시 무렵)에 한 젊은 선비가 와서 악귀를 없애고 공주를 구해 돌아갈 것이니 걱정 말라. 그 사람은 보통 선비가 아니라 동해 용왕의 아들로, 그대와 인간 세상의 인연이 있다. 그대가 이렇게 된 것도 하늘이 정한 운수이니 사람의 힘으로는 어쩔 수 없다. 부디 하늘의 명을 어기지 말고 순순히 따르라’ 하시며 이 말을 새어 나가게 하지 말라 하셨대. 그런데 오늘 그 시각이 되도록 소식이 없으니 그 꿈도 헛것인가 보다."],
["그대들은 놀라지 마라","그대들은 놀라지 마시오. 내가 여기 들어온 것은 다른 까닭이 아니라 악귀를 없애려는 것이니, 의심하지 말고 악귀가 있는 곳을 자세히 알려 주시오."],
["그대 덕분에 우리들을","그대 덕분에 우리가 살아나 공주님과 함께 각자 고향으로 돌아가게 된다면 이런 은혜가 어디 있겠습니까?"],
["그 짐승이 전각에 누워","그 짐승은 전각에 누워 앓다가 사람을 보고 일어나려 했으나 도로 넘어지며 배를 움켜쥐고 온몸을 뒤틀 뿐 움직이지 못하고, 입으로 피를 수없이 토하며 쓰러졌다."],
["너희 수십 명이 필경","너희 수십 명도 결국 모두 요귀가 변해 사람을 속이는 것이 아니냐?"],
["우리들은 하나도 요괴가","우리는 하나도 요괴가 아닙니다. 팔자가 사나워 이 요괴에게 잡혀 와서 …… 아까 공자께 보검을 드린 분이 바로 천자의 외동따님이신 금선공주님이십니다."],
["나는 과연 공주였더니","나는 정말 공주입니다. 몇 해 전 어머니를 모시고 후원에서 달구경을 하다가 이 요괴에게 잡혀 와서 …… 이 은혜는 뼈에 새겨도 잊지 못할 것이니 무엇으로 갚겠습니까. 이제는 당장 죽어도 한이 없습니다."],
["이제 공주 모시고 나아가고","당장이라도 공주님을 모시고 나가고 싶지만 길이 험하여 함부로 나서기 어려우니, 제가 잠깐 나가 북쪽 고을에 알리고 제대로 행차를 갖추어 모시도록 하겠습니다. 잠시만 기다리십시오."],
["그대 간 후에 또 무슨","그대가 떠난 뒤 또 무슨 변고가 생길지 모르니 제발 데려가 주십시오."],

function glossOf(t){
  let best=null,len=0;
  for(const [k,v] of GLOSS){if(t.startsWith(k)&&k.length>len){best=v;len=k.length}}

}

function tableGame(){
  return new Promise(res=>{

    const slots=[["b1","뒤 왼쪽","back"],["b2","뒤 가운데","back"],["b3","뒤 오른쪽","back"],["f1","앞 왼쪽","fl"],["f2","앞 오른쪽","fr"],["s","상 오른쪽 끝","side"]];

      v.querySelector(".table").innerHTML=slots.map(([sid,lab])=>{const d=place[sid]&&dishes.find(x=>x[0]===place[sid]);return `<button class="slot s-${sid}" data-s="${sid}">${d?`${d[2]}<b>${d[1]}</b>`:`<i>${lab}</i>`}</button>`}).join("")};

/* 벽에 남긴 글 읽기 */

    ${G.gloss?`<div class="gl"><b>풀이</b>하늘이 나를 내셨으나 운명이 기구하다. 난리 통에 부모를 잃고 길에서 헤매다가 이 집과 인연이 닿아 십여 년을 길러 주셨다. 은혜와 정이 깊은데 (양아버지는) 저세상으로 가시니 슬프다. 은혜를 갚으려 몸을 아끼지 않았다. 죽을 곳(구호동)에 보내져 종일 밭을 갈았고, 두 범을 잡고 살아 돌아와도 반기지 않았다. 살인 옥사에 갇혔으니 나의 재앙이 끝나지 않았구나. 불을 질렀으나 다행히 죽음을 면했다. 이제 헤어지니 눈물이 앞을 가린다. 잘못을 고치면 훗날 다시 만나리라. 지난날을 생각하면 잊을 길이 없다.</div>`:""}
    <p class="note">해룡이 겪은 일이 차례대로 적혀 있어요. 이 장의 줄거리를 정리하는 데 쓰세요.</p><div class="row"><button class="btn pri" data-go="1">계속 ▶</button></div></div>`);
}

/* 칠성 사마귀 잇기: 등의 일곱 사마귀를 북두칠성 모양으로 */

        ${i===0?`<text x="${P[0][0]}" y="${P[0][1]-6}" font-size="5" text-anchor="middle" fill="#6b3f22">시작</text>`:""}</svg>
        <svg viewBox="0 0 100 70" class="hintd"><polyline points="10,15 25,22 40,28 55,33 57,52 80,54 82,34 55,33" fill="none" stroke="#8a6a1f" stroke-width="2"/><text x="50" y="68" font-size="9" text-anchor="middle" fill="#6b5f4c">북두칠성</text></svg></div>
      ${i>=7?'<p class="note">북두칠성이 또렷하다. 장공이 말한 바로 그 표지다.</p><div class="row"><button class="btn pri" data-go>계속 ▶</button></div>':""}${msg?`<div class="resp">${msg}</div>`:""}`};
    paint();

      if(e.target.closest("[data-go]")){mgClose(v);res()}});
    UI.onKey=e=>{if(i>=7&&["Enter","Space"].includes(e.code)){mgClose(v);res()}return true};

/* ═════════ RPG 요소: 공덕, 일대일 대결, 보배의 힘, 이름 맞히기, 벽의 글 쓰기, 변신·혼례 연출 ═════════ */
/* 공덕(경험치) */
function addXp(n){G.xp=(G.xp||0)+n;writeSave();updateHUD();const c=$("#money");if(!c)return;const f=document.createElement("span");f.className="xpfly";f.textContent="+"+n+" 공덕";
  const r=c.getBoundingClientRect();f.style.left=r.left+"px";f.style.top=(r.bottom+2)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
function xpRank(){const x=G.xp||0;return x>=280?"천하에 이름난 영웅":x>=230?"나라의 기둥":x>=170?"믿음직한 장부":x>=90?"길 위의 나그네":"이제 막 길을 나선 이"}

/* 일대일 대결: 공격(때맞춰 치기)과 방어(방향 맞춰 막기)를 번갈아 */
function duelGame(cfg){
  return new Promise(res=>{
    let my=cfg.myHp||5,foe=cfg.foeHp||5,round=0,phase="intro",timer=null,pos=0,dir=1,zl=0.4,zw=0.2,tele=null,teleLeft=0,teleN=0,msg=cfg.intro||"",over=false;
    const me=cfg.meImg||PORT[G.player.look]||"p_hr",fo=PORT[cfg.foe]||"p_hogak";
    const v=mgOpen("");const box=v.querySelector(".sheet");box.classList.add("duel");
    const pips=(n,max,c)=>Array.from({length:max},(_,k)=>`<i class="${k<n?"on":""}" style="--c:${c}"></i>`).join("");
    const FX1=(who,word)=>{const el=box.querySelector(who==="me"?".dme":".dfoe"),at=box.querySelector(who==="me"?".dfoe":".dme");if(el){el.classList.remove("hitfx");void el.offsetWidth;el.classList.add("hitfx")}if(at){at.classList.remove("atkfx");void at.offsetWidth;at.classList.add("atkfx")}shk(box);const w=box.querySelector(".dword");if(w){w.textContent=word;w.classList.remove("pop2");void w.offsetWidth;w.classList.add("pop2")}
      G.shake=Math.max(G.shake||0,5);G.flash=Math.max(G.flash||0,0.25);if(cfg.ent){const t=who==="me"?G.player:cfg.ent,a=who==="me"?cfg.ent:G.player;lungeAt(a,t);t.hurt=0.35;FX.push({k:"hit",e:t,t0:performance.now()/1000,dur:0.6,word,col:who==="me"?"#f07a6a":"#f2c94c"})}};
    const paint=()=>{
      box.innerHTML=`<span class="eb">일대일 대결 · ${round?round+"합째":"맞서다"}</span><h2>${esc(cfg.title||"대결")}</h2>
      <div class="dtop"><figure class="dme"><img src="art/${me}.jpg" alt=""><figcaption>${esc(cfg.meName||NAMES[G.player.look]||"해룡")}<span class="hp">${pips(my,cfg.myHp||5,"#2b4a6f")}</span></figcaption></figure>
        <div class="dmid"><div class="dword"></div><div class="dvs">對</div></div>
        <figure class="dfoe"><img src="art/${fo}.jpg" alt=""><figcaption>${esc(cfg.name)}<span class="hp">${pips(foe,cfg.foeHp||5,"#b3362b")}</span></figcaption></figure></div>
      ${phase==="atk"?`<p class="note"><b>공격!</b> ${cfg.atkNote||"창끝이 붉은 칸에 들어왔을 때 치세요. 한가운데면 회심의 일격!"} (Space · Enter · 아래 버튼)</p><div class="bar"><div class="zone" style="left:${zl*100}%;width:${zw*100}%"></div><div class="crit" style="left:${(zl+zw*0.35)*100}%;width:${zw*0.3*100}%"></div><div class="needle"></div></div><div class="row" style="justify-content:center"><button class="btn pri" data-hit>치기!</button></div>`:""}
      ${phase==="def"?`<p class="note"><b>방어!</b> 공격이 오는 쪽 방향키(또는 버튼)를 눌러 막으세요.</p><div class="tele"><span class="tarrow">${tele?ARG[tele]:""}</span><div class="tring"><i></i></div></div>${PAD4}`:""}
      ${phase==="intro"||phase==="end"?`<div class="row" style="justify-content:center"><button class="btn pri" data-go>${phase==="end"?"계속 ▶":"싸움 시작!"}</button></div>`:""}
      <div class="resp">${msg||"&nbsp;"}</div>`;
    };
    const stop=()=>{clearInterval(timer);timer=null};
    const end=(m)=>{stop();over=true;phase="end";msg=m;paint()};
    const check=()=>{if(foe<=0){end(cfg.win||"적장이 쓰러졌다!");return true}
      if(my<=0){my=cfg.myHp||5;msg=(cfg.recoverMsg||"휘청였지만 다시 창을 고쳐 잡았다.")+" (기력 회복)"}
      if(cfg.rounds&&round>=cfg.rounds){end(cfg.draw||"승부가 나지 않는다.");return true}return false};
    const startAtk=()=>{round++;phase="atk";pos=0;dir=1;zw=Math.max(0.14,0.24-round*0.02);zl=0.15+Math.random()*(0.7-zw);paint();
      const nd=()=>box.querySelector(".needle");stop();timer=setInterval(()=>{pos+=dir*0.022*(1+round*0.12);if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}const n=nd();if(n)n.style.left=`calc(${pos*100}% - 2px)`},16)};
    const hit=()=>{if(phase!=="atk")return;stop();
      if(pos>=zl+zw*0.35&&pos<=zl+zw*0.65){foe-=2;msg="<b>회심의 일격!</b> 상대가 크게 휘청인다.";sfx("slash");sfx("whack");FX1("foe","콰앙!")}
      else if(pos>=zl&&pos<=zl+zw){foe-=1;msg=cfg.hitMsg||"창이 적장의 갑옷을 쳤다!";sfx("clang");FX1("foe","챙!")}
      else{msg="빗나갔다!";sfx("wrong")}
      paint();if(foe<=0){setTimeout(()=>check(),500);return}setTimeout(startDef,750)};
    const startDef=()=>{phase="def";teleN=0;nextTele()};
    const nextTele=()=>{if(teleN>=2){if(!check())setTimeout(startAtk,500);return}teleN++;tele="udlr"[Math.floor(Math.random()*4)];teleLeft=1;paint();sfx("pull");
      stop();const dur=Math.max(0.75,1.35-round*0.1);timer=setInterval(()=>{teleLeft-=0.016/dur;const r=box.querySelector(".tring i");if(r)r.style.width=Math.max(0,teleLeft*100)+"%";if(teleLeft<=0){stop();my--;msg=cfg.missMsg||"막지 못했다! 적의 창이 어깨를 스친다.";sfx("slap");FX1("me","퍽!");tele=null;paint();setTimeout(nextTele,650)}},16)};
    const block=a=>{if(phase!=="def"||!tele||!timer)return;stop();
      if(a===tele){msg="<b>막았다!</b> 불꽃이 튄다.";sfx("clang");FX1("foe","챙!")}else{my--;msg=cfg.wrongMsg||"엉뚱한 쪽을 막았다! 적의 창이 스친다.";sfx("slap");FX1("me","퍽!")}
      tele=null;paint();setTimeout(nextTele,600)};
    paint();
    box.addEventListener("click",e=>{if(e.target.closest("[data-hit]")){hit();return}const b=e.target.closest("[data-a]");if(b){block(b.dataset.a);return}
      if(e.target.closest("[data-go]")){if(phase==="intro"){startAtk()}else if(over){stop();mgCloseQuiet(v);res(foe<=0)}}});
    UI.onKey=e=>{if(["Space","Enter","KeyE","KeyZ"].includes(e.code)){if(phase==="atk")hit();else if(phase==="intro")startAtk();else if(over){stop();mgCloseQuiet(v);res(foe<=0)}return true}const a=ARR[e.code];if(a)block(a);return true};
  });
}
function mgCloseQuiet(v){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false)}

/* 보배의 힘 고르기: 어떤 신통력이 어느 보배에서 나오는지 */
function usePower(ans,q){
  return new Promise(res=>{
    const ids=["silk","fan","redfan","flag"];let tries=0,msg="";
    const v=mgOpen("");const box=v.querySelector(".sheet");
    const paint=()=>{box.innerHTML=`<span class="eb">보배와 신통력</span><h2>어느 보배와 이어질까?</h2><p class="note">${esc(q)}<br><span style="font-size:.9em">원문은 어떤 보배를 썼는지 말하지 않아요. 선관들이 보배를 주며 한 말에 비추어 골라 보세요.</span></p>
      <div class="pows">${ids.map((id,k)=>`<button data-cy="${k}" data-pw="${id}"><img src="art/${ITEMS[id].img}.jpg" alt=""><b>${esc(ITEMS[id].n)}</b></button>`).join("")}</div>${msg?`<div class="resp">${msg}</div>`:""}`};
    paint();
    box.addEventListener("click",e=>{const b=e.target.closest("[data-pw]");if(!b)return;const id=b.dataset.pw;
      if(id===ans){sfx("correct");mgCloseQuiet(v);if(!tries)addXp(10);powerPop(id);res()}
      else{tries++;miss(q);sfx("wrong");msg=`${esc(ITEMS[id].n)}: ${esc(ITEMS[id].d)} 이 일과는 잘 이어지지 않아요.`;paint();shk(box)}});
    UI.onKey=e=>{const d=parseInt(e.key);if(d>=1&&d<=4){box.querySelector(`[data-cy="${d-1}"]`).click()}return true};
  });
}
/* 금방울의 보배 단추(굴러다니는 동안 쓸 수 있는 힘) */
let skillCd=0;
function useSkill(id){
  if(G.busy||UI.modal||G.demo||G.player.look!=="bell"||!(G.skills||[]).includes(id))return;const now=performance.now();if(now<skillCd)return;skillCd=now+1200;
  powerPop(id);const [x,y]=entPos(G.player);
  if(id==="fan"){if(!G.tileTask){G.pspeed=0.09;setTimeout(()=>{if(!G.tileTask)G.pspeed=null},5000)}for(let i=0;i<10;i++)addPart({k:"dust",x:x+8,y:y+12,vx:Math.random()*40-20,vy:-8,life:0.5})}
  else if(id==="silk"){for(let i=0;i<26;i++){const a=Math.random()*6.28;addPart({k:"spark",x:x+8,y:y+4,vx:Math.cos(a)*40,vy:Math.sin(a)*40,life:0.8,c:i%2?"#ffb45a":"#9cc7dc"})}}
  else if(id==="redfan"){for(let i=0;i<30;i++)addPart({k:"petal",x:x-40+Math.random()*80,y:y-30+Math.random()*50,vx:70+Math.random()*40,vy:Math.random()*10-5,life:0.9,ph:Math.random()*6,c:"#f6f8fb"});sfx("wind")}
  else if(id==="flag"){G.shake=5;sfx("thud");for(let i=0;i<12;i++)addPart({k:"dust",x:x+8,y:y+14,vx:Math.random()*60-30,vy:-14-Math.random()*10,life:0.6})}
}
function paintSkills(){const el=$("#skills");if(!el)return;const on=!G.demo&&G.route==="bell"&&G.player.look==="bell"&&(G.skills||[]).length&&!$("#hud").hidden;el.hidden=!on;if(!on)return;
  const key=G.skills.join(",");if(el.dataset.k===key)return;el.dataset.k=key;
  const tip={silk:"덥고 차게",fan:"빨리 달리기",redfan:"바람",flag:"힘"};
  el.innerHTML=["silk","fan","redfan","flag"].filter(i=>G.skills.includes(i)).map((id,k)=>`<button data-sk="${id}" title="${ITEMS[id].n}"><img src="art/${ITEMS[id].img}.jpg" alt=""><span>${["1","2","3","4"][["silk","fan","redfan","flag"].indexOf(id)]}</span><em>${tip[id]}</em></button>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-sk]");if(b)useSkill(b.dataset.sk)});
addEventListener("keydown",e=>{if(UI.modal)return;const k={Digit1:"silk",Digit2:"fan",Digit3:"redfan",Digit4:"flag"}[e.code];if(k)useSkill(k)});

/* 이름 맞히기: 한 인물의 여러 이름 */
function aliasGame(list){
  return new Promise(res=>{
    const who={hr:"장해룡",bell:"금방울",jang:"장공"};let i=0,msg="",wrong=0;

const FX=[];
async function flog(target,n,opt){
  opt=opt||{};
  const hit=G.map.npcs.find(x=>(x.look==="sar"||x.look==="guard")&&x!==target&&visible(x));let back=null;
  if(hit){back=[hit.tx,hit.ty,hit.dir];G.flash=0;setNear(hit,[[target.tx-1,target.ty],[target.tx+1,target.ty],[target.tx-1,target.ty+1],[target.tx+1,target.ty+1]]);hit.dir=hit.tx<target.tx?"r":"l";hit.fixed=1;await sleep(250)}
  for(let i=0;i<n;i++){
    const t0=performance.now()/1000;FX.push({k:"paddle",e:target,t0,dur:0.42,count:(opt.from||0)+i+1,tool:opt.tool});
    await sleep(210);sfx(opt.sfx||"whack");G.shake=Math.max(G.shake||0,opt.hard?5:3.5);target.hurt=0.35;
    FX.push({k:"hit",e:target,t0:performance.now()/1000,dur:0.5,count:(opt.from||0)+i+1});
    await sleep(opt.fast?260:380);
  }
  if(hit&&back){await sleep(200);hit.tx=back[0];hit.ty=back[1];hit.dir=back[2]}
}
function drawFX(t){
  const cx=G.cam.x,cy=G.cam.y;
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(t-f.t0)/f.dur;if(p>1.2){FX.splice(i,1);continue}if(p<0)continue;
    const [px,py]=entPos(f.e),sx=Math.round(px-cx),sy=Math.round(py-cy);
    if(f.k==="fly"){const [qx,qy]=entPos(f.to),q=Math.min(1,p);if(p<1.02)drawHeldIcon(f.id,sx+8+(qx-px)*q,sy-2+(qy-py)*q-Math.sin(Math.PI*q)*18,t);continue}
    if(f.k==="paddle"&&f.tool){const a=0.5-Math.min(1,p*1.9)*2.0;ctx.save();ctx.translate(sx+25,sy+3);ctx.rotate(a);ctx.scale(1.5,1.5);drawHeldIcon(f.tool,0,0,t);ctx.restore()}
    else if(f.k==="paddle"){const a=-1.7+Math.min(1,p*1.9)*2.3;ctx.save();ctx.translate(sx+26,sy-30);ctx.rotate(a);
      ctx.fillStyle="#1d1813";ctx.fillRect(-4,-1,8,40);ctx.fillStyle="#6d4b2c";ctx.fillRect(-2,0,4,14);ctx.fillStyle="#a07a4c";ctx.fillRect(-3,14,6,24);ctx.fillStyle="#c49a64";ctx.fillRect(-2,15,1,22);ctx.restore()}
    if(f.k==="hit"&&p<1){const r=4+p*10,al=1-p;ctx.globalAlpha=al;ctx.fillStyle="#fff6c8";
      for(let k=0;k<8;k++){const an=k*Math.PI/4+0.3;ctx.fillRect(Math.round(sx+8+Math.cos(an)*r)-1,Math.round(sy-2+Math.sin(an)*r)-1,2,2)}
      ctx.fillStyle="#e0493a";ctx.fillRect(sx+6,sy-4,4,4);ctx.globalAlpha=1}
  }
}

function holdDel(e,id){const a=holdList(e).filter(x=>x!==id);e.hold=a.length?a:null;if(e===G.player)paintBag()}
function holdSet(e,v){e.hold=v||null;if(e===G.player)paintBag()}

/* 인물 그림 위에 손에 든 것을 덧그림 (engine draw 에서 부름) */
function drawHeld(e,sx,sy,topY,t){
  const a=holdList(e);if(!a.length)return;
  const bob=e.moving?Math.round(Math.abs(Math.sin((e.step+e.prog)*Math.PI))):0;
  let hand=0,over=0;const nOver=Math.max(0,a.filter(id=>!(HELD[id]||{}).pos).length-(e.look==="bell"?0:2));
  for(const id of a){const h=HELD[id];if(!h)continue;
    if(h.pos==="neck"){h.d(sx+8,Math.round(topY+15),t);continue}
    if(e.down)continue;
    if(h.pos==="back"){h.d(sx+8+(e.dir==="r"?-6:e.dir==="l"?6:0),Math.round(topY+17)-bob,t);continue}
    if(e.look==="bell"){const n=a.length;h.d(sx+8+(hand-(n-1)/2)*10,Math.round(topY+4+Math.sin(t*4+hand)*1.2),t);hand++;continue}
    if(hand<2){const right=(hand===0)!==(e.dir==="l");h.d(sx+(right?15:1),sy+5-bob,t);hand++}
    else{h.d(sx+8+(over-(nOver-1)/2)*11,Math.round(topY-3+Math.sin(t*3+over)*1.5),t);over++}
  }
}

/* ═════════ 소품 그림: 한 줄에 여러 개 그린 그림을 잘라, 점으로 찍은 소품 대신 씀 ═════════ */
/* PICSHEETS·PICSPEC·PICPROPS 는 이 파일 앞에서 놀이마다 따로 정함. 그림을 못 읽거나 개수가 안 맞으면 점 그림을 그대로 씀 */
const ITEMPIC={};
function cutRow(img,ids){
  const W=img.naturalWidth,H=img.naturalHeight;if(!W||!H)return false;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(img,0,0);
  const d=g.getImageData(0,0,W,H),a=d.data;
  const cs=[[2,2],[W-3,2],[2,H-3],[W-3,H-3]].map(([x,y])=>{const i=(y*W+x)*4;return[a[i],a[i+1],a[i+2]]});
  keyOut(a,W,H,[0,1,2].map(k=>cs.reduce((s,q)=>s+q[k],0)/4));
  /* 이어진 덩어리마다 번호를 매겨 물건을 가름 (옆 물건과 좌우로 겹쳐도 됨) */
  const lab=new Int32Array(W*H);let comps=[];const st=[];
  for(let p0=0;p0<W*H;p0++){if(!a[p0*4+3]||lab[p0])continue;const id=comps.length+1;const cm={x0:W,x1:0,y0:H,y1:0,n:0,ls:[id]};lab[p0]=id;st.push(p0);
    while(st.length){const p=st.pop(),x=p%W,y=(p-x)/W;cm.n++;if(x<cm.x0)cm.x0=x;if(x>cm.x1)cm.x1=x;if(y<cm.y0)cm.y0=y;if(y>cm.y1)cm.y1=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const q=ny*W+nx;if(a[q*4+3]&&!lab[q]){lab[q]=id;st.push(q)}}}
    comps.push(cm)}
  comps=comps.filter(m=>m.n>=20);
  const gap=(p,q)=>Math.max(0,Math.max(p.x0,q.x0)-Math.min(p.x1,q.x1))+Math.max(0,Math.max(p.y0,q.y0)-Math.min(p.y1,q.y1));
  while(comps.length>ids.length){let bi=0,bj=1,bg=1e9;for(let i=0;i<comps.length;i++)for(let j=i+1;j<comps.length;j++){const v=gap(comps[i],comps[j]);if(v<bg||(v===bg&&comps[i].n+comps[j].n<comps[bi].n+comps[bj].n)){bg=v;bi=i;bj=j}}
    if(bg>W*0.04)return false;const p=comps[bi],q=comps[bj];comps.splice(bj,1);Object.assign(p,{x0:Math.min(p.x0,q.x0),x1:Math.max(p.x1,q.x1),y0:Math.min(p.y0,q.y0),y1:Math.max(p.y1,q.y1),n:p.n+q.n,ls:p.ls.concat(q.ls)})}
  if(comps.length!==ids.length)return false;
  comps.sort((p,q)=>(p.x0+p.x1)-(q.x0+q.x1));
  ids.forEach((id,k)=>{const m=comps[k],w=m.x1-m.x0+1,h=m.y1-m.y0+1,set=new Set(m.ls);
    const t=document.createElement("canvas");t.width=w;t.height=h;const tg=t.getContext("2d"),td=tg.createImageData(w,h),ta=td.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(m.y0+y)*W+m.x0+x;if(set.has(lab[p])){const i=p*4,j=(y*w+x)*4;ta[j]=a[i];ta[j+1]=a[i+1];ta[j+2]=a[i+2];ta[j+3]=a[i+3]}}
    tg.putImageData(td,0,0);
    const sp=PICSPEC[id]||["h",12,"bot"],sc=(sp[1]*Q*2)/(sp[0]==="w"?w:h);
    const o=document.createElement("canvas");o.width=Math.max(1,Math.round(w*sc));o.height=Math.max(1,Math.round(h*sc));const og=o.getContext("2d");og.imageSmoothingEnabled=true;og.imageSmoothingQuality="high";og.drawImage(t,0,0,w,h,0,0,o.width,o.height);
    ITEMPIC[id]=o;for(const al of (PICALIAS[id]||[]))ITEMPIC[al]=o});
  return true;
}

function bfsReach(tx,ty){const m=G.map,p=G.player,seen=new Set([p.tx+","+p.ty]),q=[[p.tx,p.ty]];
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+","+ny;if(seen.has(k))continue;if(blocked(nx,ny,p))continue;
    if(Math.abs(nx-tx)+Math.abs(ny-ty)===1)return true;seen.add(k);q.push([nx,ny])}}return false}
